<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFRARIS</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            font-family: 'Arial', sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .background-text {
            position: absolute;
            font-size: 35vw;
            font-weight: 900;
            color: rgba(254, 0, 0, 0.08);
            z-index: 0;
            text-transform: uppercase;
            pointer-events: none;
            animation: float 15s infinite ease-in-out alternate;
            text-shadow: 0 0 50px rgba(254, 0, 0, 0.2);
            letter-spacing: 20px;
        }

        .matrix-rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .matrix-column {
            position: absolute;
            top: -100%;
            width: 20px;
            color: #fe0000;
            font-size: 20px;
            text-align: center;
            text-shadow: 0 0 8px rgba(254, 0, 0, 0.8);
            animation: matrixRain linear infinite;
        }

        @keyframes matrixRain {
            0% {
                transform: translateY(-100%);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        .matrix-text {
            position: absolute;
            font-size: 35vw;
            font-weight: 900;
            color: rgba(254, 0, 0, 0.05);
            z-index: 0;
            text-transform: uppercase;
            pointer-events: none;
            animation: float 15s infinite ease-in-out alternate;
            text-shadow: 0 0 50px rgba(254, 0, 0, 0.1);
            letter-spacing: 20px;
            mix-blend-mode: screen;
        }

        @keyframes float {
            0% { transform: translate(-50%, -50%) rotateX(0deg) rotateY(0deg) scale(1); }
            50% { transform: translate(-50%, -50%) rotateX(5deg) rotateY(5deg) scale(1.1); }
            100% { transform: translate(-50%, -50%) rotateX(0deg) rotateY(10deg) scale(1); }
        }

        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 15;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(254, 0, 0, 0.1);
        }

        .logo-container {
            position: relative;
            z-index: 10;
            transform-style: preserve-3d;
            animation: rotate 20s infinite linear;
            width: 300px;
            height: 300px;
            margin-bottom: 50px;
            filter: drop-shadow(0 0 20px rgba(254, 0, 0, 0.3));
        }

        @keyframes rotate {
            0% { transform: rotateY(0deg) rotateX(10deg); }
            100% { transform: rotateY(360deg) rotateX(10deg); }
        }

        .logo {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(254, 0, 0, 0.8));
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { filter: drop-shadow(0 0 20px rgba(254, 0, 0, 0.8)); }
            100% { filter: drop-shadow(0 0 40px rgba(254, 0, 0, 1)); }
        }

        .coming-soon {
            position: relative;
            font-size: 4rem;
            font-weight: 900;
            color: white;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(254, 0, 0, 0.8);
            animation: impact 1s ease-out forwards;
            z-index: 5;
            opacity: 0;
            margin-top: 20px;
            background: linear-gradient(45deg, #fff, #fe0000);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            padding: 20px 40px;
            border-radius: 10px;
        }

        .description {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            max-width: 600px;
            margin-top: 20px;
            line-height: 1.6;
            animation: fadeIn 1s ease-out forwards 1s;
            opacity: 0;
        }

        @keyframes impact {
            0% { 
                transform: scale(0.5);
                opacity: 0;
                text-shadow: 0 0 0 rgba(254, 0, 0, 0);
            }
            50% { 
                transform: scale(1.2);
                opacity: 1;
                text-shadow: 0 0 50px rgba(254, 0, 0, 0.8);
            }
            100% { 
                transform: scale(1);
                opacity: 1;
                text-shadow: 0 0 20px rgba(254, 0, 0, 0.8);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .instagram-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            margin: 30px auto 0;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 10px rgba(40,90,235,0.15);
        }
        .instagram-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(40,90,235,0.3);
        }
        .instagram-icon svg {
            display: block;
        }
        /* Responsive adjustments for the icon */
        @media (max-width: 768px) {
            .instagram-icon {
                width: 32px;
                height: 32px;
                margin-top: 20px;
            }
        }
        @media (max-width: 480px) {
            .instagram-icon {
                width: 26px;
                height: 26px;
                margin-top: 15px;
            }
        }

        .social-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background-color: rgba(254, 0, 0, 0.5);
            border-radius: 50%;
            pointer-events: none;
            animation: particleFloat 15s infinite linear;
        }

        @keyframes particleFloat {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }

        @media (max-width: 1200px) {
            .content-container {
                padding: 1.5rem;
            }
            
            .logo-container {
                width: 250px;
                height: 250px;
            }
            
            .coming-soon {
                font-size: 3.5rem;
            }
            
            .description {
                font-size: 1.1rem;
                max-width: 500px;
            }
        }

        @media (max-width: 768px) {
            .content-container {
                padding: 1rem;
            }
            
            .logo-container {
                width: 200px;
                height: 200px;
                margin-bottom: 30px;
            }
            
            .coming-soon {
                font-size: 2.5rem;
                padding: 15px 30px;
            }
            
            .description {
                font-size: 1rem;
                max-width: 400px;
                margin-top: 15px;
            }
        }

        @media (max-width: 480px) {
            .content-container {
                padding: 0.8rem;
            }
            
            .logo-container {
                width: 150px;
                height: 150px;
                margin-bottom: 20px;
            }
            
            .coming-soon {
                font-size: 2rem;
                padding: 10px 20px;
            }
            
            .description {
                font-size: 0.9rem;
                max-width: 300px;
                margin-top: 10px;
                line-height: 1.4;
            }
        }

        @media (max-width: 320px) {
            .content-container {
                padding: 0.5rem;
            }
            
            .logo-container {
                width: 120px;
                height: 120px;
                margin-bottom: 15px;
            }
            
            .coming-soon {
                font-size: 1.8rem;
                padding: 8px 16px;
            }
            
            .description {
                font-size: 0.8rem;
                max-width: 250px;
            }
        }

        /* Ajustements pour les très grands écrans */
        @media (min-width: 1600px) {
            .content-container {
                padding: 3rem;
            }
            
            .logo-container {
                width: 400px;
                height: 400px;
            }
            
            .coming-soon {
                font-size: 5rem;
            }
            
            .description {
                font-size: 1.4rem;
                max-width: 800px;
            }
        }
    </style>
</head>

    <div class="particles" id="particles"></div>

    <script>
        // Create particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 100;
        
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Random size between 2px and 6px
            const size = Math.random() * 4 + 2;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            
            // Random position
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;
            
            // Random opacity
            particle.style.opacity = Math.random() * 0.5 + 0.1;
            
            // Random animation duration
            const duration = Math.random() * 20 + 10;
            particle.style.animationDuration = `${duration}s`;
            
            // Random animation delay
            particle.style.animationDelay = `${Math.random() * 5}s`;
            
            particlesContainer.appendChild(particle);
        }

        // Add mouse move effect to logo
        const logoContainer = document.querySelector('.logo-container');
        
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            logoContainer.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Reset position when mouse leaves
        document.addEventListener('mouseleave', () => {
            logoContainer.style.transform = 'rotateY(0deg) rotateX(0deg)';
        });

        // Matrix rain effect
        function createMatrixRain() {
            const container = document.getElementById('matrixRain');
            const columns = Math.floor(window.innerWidth / 20);
            const letters = 'INFRARIS';
            
            for (let i = 0; i < columns; i++) {
                const column = document.createElement('div');
                column.className = 'matrix-column';
                column.style.left = `${i * 20}px`;
                column.style.animationDuration = `${Math.random() * 4 + 3}s`;
                column.style.animationDelay = `${Math.random() * 3}s`;
                
                // Generate INFRARIS letters
                const length = Math.floor(Math.random() * 15) + 8;
                let text = '';
                for (let j = 0; j < length; j++) {
                    text += letters[Math.floor(Math.random() * letters.length)] + '<br>';
                }
                column.innerHTML = text;
                
                container.appendChild(column);
            }
        }

        // Initialize matrix rain
        createMatrixRain();

        // Update matrix rain on window resize
        window.addEventListener('resize', () => {
            const container = document.getElementById('matrixRain');
            container.innerHTML = '';
            createMatrixRain();
        });
    </script>
</body>
</html>
